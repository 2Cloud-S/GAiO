<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      letter-spacing: -0.04em;
    }
    @media (prefers-color-scheme: light) {
